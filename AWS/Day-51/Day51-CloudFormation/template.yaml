AWSTemplateFormatVersion: '2010-09-09'
Description: Day 51 practice queue isolated from Day 50 cost monitoring.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Resources:
  PracticeQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: Disposable queue for learning infrastructure as code.
        must:
          - Use only practice messages.
          - Keep independent of Day 50 resources.
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      Tags:
        - Key: Project
          Value: Cloud-AI-Journey
        - Key: Day
          Value: '51'

Outputs:
  QueueUrl:
    Description: URL of the practice queue
    Value: !Ref PracticeQueue